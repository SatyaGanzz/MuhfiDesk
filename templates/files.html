<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Files - MuhfiDesk</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=5">
    <style>
        /* File Manager Specific Styles */
        .fm-container {
            display: flex;
            height: calc(100vh - 120px);
            gap: 0;
            overflow: hidden;
        }

        /* Sidebar */
        .fm-sidebar {
            width: 240px;
            background: rgba(0, 0, 0, 0.3);
            border-right: 1px solid var(--glass-border);
            overflow-y: auto;
            flex-shrink: 0;
            padding: 0.5rem;
        }

        .fm-sidebar.collapsed {
            width: 0;
            padding: 0;
            overflow: hidden;
        }

        .tree-item {
            display: flex;
            align-items: center;
            padding: 0.4rem 0.6rem;
            cursor: pointer;
            border-radius: 6px;
            font-size: 0.85rem;
            gap: 0.5rem;
            color: #ccc;
        }

        .tree-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .tree-item.active {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
        }

        .tree-item i {
            color: #FF9966;
            width: 16px;
        }

        .tree-children {
            padding-left: 1rem;
            display: none;
        }

        .tree-children.open {
            display: block;
        }

        /* Main Content */
        .fm-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 0;
        }

        /* Header / Toolbar */
        .fm-header {
            padding: 0.8rem 1rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            border-bottom: 1px solid var(--glass-border);
            flex-wrap: wrap;
        }

        /* Breadcrumbs */
        .fm-breadcrumbs {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            font-size: 0.9rem;
            flex-wrap: wrap;
            flex: 1;
        }

        .fm-crumb {
            color: var(--text-muted);
            cursor: pointer;
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
        }

        .fm-crumb:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .fm-crumb.active {
            color: #fff;
            font-weight: 500;
            cursor: default;
        }

        .fm-crumb-sep {
            color: #555;
            font-size: 0.8rem;
        }

        /* Table */
        .fm-table-wrap {
            flex: 1;
            overflow-y: auto;
            padding: 0;
        }

        .fm-table {
            --list-font-size: 0.85rem;
            --list-padding: 0.5rem 0.8rem;
            width: 100%;
            border-collapse: collapse;
            font-size: var(--list-font-size);
            transition: font-size 0.2s ease;
        }

        .fm-table th,
        .fm-table td {
            padding: var(--list-padding);
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: padding 0.2s ease;
        }

        .fm-table th {
            position: sticky;
            top: 0;
            background: #1e1e28;
            font-weight: 500;
            color: var(--text-muted);
            font-size: 0.8rem;
            text-transform: uppercase;
        }

        .fm-table tr {
            cursor: pointer;
        }

        .fm-table tr:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        .fm-table tr.selected {
            background: rgba(100, 150, 255, 0.15);
        }

        .fm-icon {
            width: 20px;
            text-align: center;
            margin-right: 0.5rem;
        }

        .fm-icon.dir {
            color: #FF9966;
        }

        .fm-icon.file {
            color: #888;
        }

        /* Compact Mode */
        body.compact .fm-table td,
        body.compact .fm-table th {
            padding: 0.3rem 0.6rem;
            font-size: 0.8rem;
        }

        body.compact .tree-item {
            padding: 0.3rem 0.5rem;
            font-size: 0.8rem;
        }

        /* Detail Panel */
        .fm-detail {
            width: 280px;
            background: rgba(0, 0, 0, 0.3);
            border-left: 1px solid var(--glass-border);
            padding: 1rem;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .fm-detail.hidden {
            display: none;
        }

        .fm-detail h4 {
            margin: 0 0 1rem;
            font-weight: 500;
            word-break: break-all;
        }

        .fm-detail-row {
            display: flex;
            justify-content: space-between;
            padding: 0.4rem 0;
            font-size: 0.85rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .fm-detail-row span:first-child {
            color: var(--text-muted);
        }

        .fm-detail-row span:last-child {
            color: #fff;
            text-align: right;
            max-width: 150px;
            word-break: break-all;
        }

        .fm-detail-actions {
            margin-top: 1rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        /* Context Menu */
        .context-menu {
            position: fixed;
            background: #2a2a35;
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            padding: 0.5rem 0;
            min-width: 160px;
            z-index: 300;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .context-menu.hidden {
            display: none;
        }

        .ctx-item {
            padding: 0.5rem 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            font-size: 0.9rem;
        }

        .ctx-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .ctx-item.danger {
            color: #ff6b6b;
        }

        .ctx-sep {
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
            margin: 0.3rem 0;
        }

        /* Toolbar Buttons */
        .fm-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .fm-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .fm-btn.active {
            background: rgba(100, 150, 255, 0.2);
            border-color: rgba(100, 150, 255, 0.3);
        }

        /* Status Bar */
        .fm-status {
            padding: 0.4rem 1rem;
            font-size: 0.8rem;
            color: var(--text-muted);
            border-top: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
        }

        /* Locations Sidebar */
        .fm-locations {
            margin-top: 1.5rem;
            padding: 0 0.5rem;
        }
        .fm-loc-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 0.5rem;
            padding: 0 0.5rem;
        }
        .fm-btn-small {
            background: transparent;
            border: none;
            color: #aaa;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .fm-btn-small:hover {
            color: #fff;
        }
        .loc-dropdown {
            background: rgba(40, 40, 50, 0.95);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            padding: 0.5rem;
            margin-top: 0.5rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }
        .loc-dropdown.hidden {
            display: none;
        }
        .loc-item {
            padding: 0.5rem;
            font-size: 0.85rem;
            color: #ccc;
            cursor: pointer;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .loc-item:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }
    
        /* Drag and Drop Overlay */
        #drop-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: white;
            font-size: 1.5rem;
            font-weight: 600;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        #drop-overlay.active {
            opacity: 1;
        }
        #drop-overlay i {
            font-size: 4rem;
            color: #FF9966;
            margin-bottom: 1rem;
        }

        /* ---- Upload Progress Widget ---- */
        #upload-progress-widget {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            width: 360px;
            max-width: calc(100vw - 2rem);
            background: rgba(22, 27, 34, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05);
            z-index: 10001;
            overflow: hidden;
            transform: translateY(120%) scale(0.95);
            opacity: 0;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
            pointer-events: none;
        }
        #upload-progress-widget.active {
            transform: translateY(0) scale(1);
            opacity: 1;
            pointer-events: auto;
        }
        #upload-progress-widget.hiding {
            transform: translateY(120%) scale(0.95);
            opacity: 0;
            pointer-events: none;
        }
        .upw-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }
        .upw-title {
            font-weight: 600;
            font-size: 0.85rem;
            color: #e6edf3;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .upw-title i {
            color: #FF9966;
            font-size: 1rem;
        }
        .upw-actions button {
            background: none;
            border: none;
            color: #8b949e;
            cursor: pointer;
            font-size: 0.9rem;
            padding: 4px 6px;
            border-radius: 4px;
            transition: all 0.15s;
        }
        .upw-actions button:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #f85149;
        }
        .upw-files {
            padding: 0.5rem 1rem;
            max-height: 80px;
            overflow-y: auto;
        }
        .upw-file-item {
            font-size: 0.75rem;
            color: #8b949e;
            padding: 2px 0;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .upw-file-item i {
            color: #58a6ff;
            font-size: 0.7rem;
            flex-shrink: 0;
        }
        .upw-bar-wrap {
            margin: 0 1rem 0.4rem;
            height: 6px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 3px;
            overflow: hidden;
        }
        .upw-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #FF9966, #FF5E62);
            border-radius: 3px;
            transition: width 0.3s ease;
            position: relative;
        }
        .upw-bar::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            animation: upw-shimmer 1.5s infinite;
        }
        .upw-bar.success {
            background: linear-gradient(90deg, #238636, #3fb950);
        }
        .upw-bar.success::after {
            animation: none;
        }
        .upw-bar.error {
            background: linear-gradient(90deg, #da3633, #f85149);
        }
        .upw-bar.error::after {
            animation: none;
        }
        @keyframes upw-shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        .upw-details {
            display: flex;
            justify-content: space-between;
            padding: 0 1rem 0.6rem;
            font-size: 0.72rem;
            color: #8b949e;
        }
        .upw-percent {
            font-weight: 600;
            color: #e6edf3;
        }
        .upw-result {
            padding: 0.5rem 1rem 0.7rem;
            font-size: 0.78rem;
            color: #e6edf3;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* Editor Modal */
        .editor-modal {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.75); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem;
        }
        .editor-header {
            background: var(--bg-elevated, #1c2128); width: 100%; max-width: 1000px; padding: 1rem 1.5rem;
            border-radius: 12px 12px 0 0; border: 1px solid var(--glass-border, rgba(255,255,255,0.15)); border-bottom: none;
            display: flex; justify-content: space-between; align-items: center; box-sizing: border-box;
        }
        .editor-header h3 {
            margin: 0; font-weight: 500; color: #fff; font-size: 1.1rem;
        }
        .editor-body {
            background: var(--bg-base, #0d1117); width: 100%; max-width: 1000px; height: 75vh;
            border-radius: 0 0 12px 12px; border: 1px solid var(--glass-border, rgba(255,255,255,0.15));
            display: flex; box-sizing: border-box; overflow: hidden;
        }
        #editor-textarea {
            width: 100%; height: 100%; background: transparent; border: none; color: #e6edf3;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace; font-size: 0.95rem; padding: 1.5rem;
            resize: none; outline: none; box-sizing: border-box; line-height: 1.6;
        }

        /* Prevent fm-container glass hover effect */
        body .fm-container.glass:hover {
            transform: none !important;
            box-shadow: var(--shadow) !important;
            cursor: default !important;
            background: var(--glass-bg) !important;
            border-color: var(--glass-border) !important;
        }

        /* Grid View Layout */
        #file-grid {
            --grid-size: 110px;
            --icon-size: 3rem;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(var(--grid-size), 1fr));
            gap: 1rem;
            padding: 1rem;
            align-content: start;
        }
        .grid-item {
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            padding: 1rem 0.5rem; border-radius: 8px; cursor: pointer; text-align: center;
            border: 1px solid transparent; transition: background 0.2s, border 0.2s;
        }
        .grid-item:hover {
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .grid-item.selected {
            background: rgba(100, 150, 255, 0.15); border: 1px solid rgba(100, 150, 255, 0.3);
        }
        .grid-item .icon {
            font-size: var(--icon-size); margin-bottom: 0.8rem;
            transition: font-size 0.2s ease;
        }
        .grid-item .name {
            font-size: 0.85rem; word-break: break-word; display: -webkit-box;
            -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: var(--text-main);
        }
    </style>
    <script src="{{ url_for('static', filename='theme.js') }}"></script>
    <script>
        function updateGridZoom(value) {
            const grid = document.getElementById('file-grid');
            if (grid) {
                grid.style.setProperty('--grid-size', value + 'px');
                const iconSize = (value / 110) * 3;
                grid.style.setProperty('--icon-size', iconSize + 'rem');
            }
            
            const listTable = document.querySelector('.fm-table');
            if (listTable) {
                const scale = value / 110;
                const fontSize = Math.max(0.75, 0.85 * scale);
                listTable.style.setProperty('--list-font-size', fontSize + 'rem');
                
                const padTop = Math.max(0.3, 0.5 * scale);
                const padSide = Math.max(0.5, 0.8 * scale);
                listTable.style.setProperty('--list-padding', `${padTop}rem ${padSide}rem`);
            }
            
            localStorage.setItem('fm_grid_zoom', value);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const savedZoom = localStorage.getItem('fm_grid_zoom');
            if (savedZoom) {
                const slider = document.getElementById('grid-zoom');
                if (slider) {
                    slider.value = savedZoom;
                    updateGridZoom(savedZoom);
                }
            }
        });
    </script>
</head>

<body>
    <div class="wallpaper"></div>

    <div class="app-container" style="padding: 0.5rem 1rem; max-width: none;">
        <!-- Top Header -->
        <header style="display:flex; align-items:center; gap:1rem; padding:0.5rem 0; margin-bottom:0.5rem">
            <button class="fm-btn" onclick="window.location.href='/dashboard'"><i class="fa-solid fa-home"></i></button>
            <h2 style="margin:0; font-weight:400; font-size:1.1rem">File Manager</h2>
            <div style="margin-left:auto; display:flex; gap:0.5rem">
                <button class="fm-btn" id="btn-compact" onclick="toggleCompact()"><i class="fa-solid fa-compress"></i>
                    Compact</button>
                <button class="fm-btn" id="btn-sidebar" onclick="toggleSidebar()"><i
                        class="fa-solid fa-bars"></i></button>
            </div>
        </header>

        <!-- Main Layout -->
        <div class="fm-container glass">
            <!-- Sidebar Tree -->
            <div class="fm-sidebar" id="sidebar">
                <div id="sidebar-tree"></div>
                


            </div>

            <!-- Main Content -->
            <div class="fm-main">
                <!-- Toolbar / Breadcrumbs -->
                <div class="fm-header">
                    <div class="fm-breadcrumbs" id="breadcrumbs"></div>
                    <div style="display:flex; align-items:center; gap:0.5rem">
                        <input type="text" id="search-input" placeholder="Search files..." style="background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.1); 
                            color:#fff; padding:0.4rem 0.8rem; border-radius:6px; font-size:0.85rem; width:180px"
                            onkeyup="filterFiles(this.value)">
                        <button class="fm-btn" onclick="clearSearch()"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                    <button class="fm-btn" onclick="createNew('folder')"><i class="fa-solid fa-folder-plus"></i></button>
                    <button class="fm-btn" onclick="createNew('file')"><i class="fa-solid fa-file-circle-plus"></i></button>
                    <button class="fm-btn" onclick="loadFiles(currentPath)"><i class="fa-solid fa-rotate-right"></i></button>
                    
                    <div style="border-left: 1px solid var(--glass-border); margin: 0 0.2rem; height: 24px;"></div>
                    
                    <div id="grid-zoom-container" style="display:flex; align-items:center; gap:0.5rem; margin:0 0.5rem;">
                        <i class="fa-solid fa-magnifying-glass-minus" style="font-size:0.8rem; color:var(--text-muted)"></i>
                        <input type="range" id="grid-zoom" min="80" max="250" value="110" style="width:70px; cursor:pointer;" oninput="updateGridZoom(this.value)">
                        <i class="fa-solid fa-magnifying-glass-plus" style="font-size:0.8rem; color:var(--text-muted)"></i>
                    </div>

                    <button class="fm-btn active" id="btn-view-list" onclick="setDisplayFormat('list')" title="List View"><i class="fa-solid fa-list"></i></button>
                    <button class="fm-btn" id="btn-view-grid" onclick="setDisplayFormat('grid')" title="Grid View"><i class="fa-solid fa-border-all"></i></button>
                    <div style="border-left: 1px solid var(--glass-border); margin: 0 0.2rem; height: 24px;"></div>

                    <input type="file" id="upload-input" multiple style="display:none" onchange="uploadFiles(this.files)">
                    <button class="fm-btn" onclick="document.getElementById('upload-input').click()" style="background:#238636">
                        <i class="fa-solid fa-upload"></i> Upload
                    </button>
                    <button class="fm-btn" onclick="downloadSelected()"><i class="fa-solid fa-download"></i></button>

                </div>

                <!-- File Table -->
                <div class="fm-table-wrap">
                    <table class="fm-table" id="fm-table-view">
                        <thead>
                            <tr>
                                <th style="width:45%; cursor:pointer" onclick="toggleSort('name')">Name <i id="sort-icon-name" class="fa-solid fa-sort"></i></th>
                                <th style="cursor:pointer" onclick="toggleSort('size')">Size <i id="sort-icon-size" class="fa-solid fa-sort"></i></th>
                                <th>Permissions</th>
                                <th style="cursor:pointer" onclick="toggleSort('date')">Modified <i id="sort-icon-date" class="fa-solid fa-sort"></i></th>
                            </tr>
                        </thead>
                        <tbody id="file-list"></tbody>
                    </table>
                    <div id="file-grid" style="display:none;"></div>
                </div>

                <!-- Status Bar -->
                <div class="fm-status">
                    <span id="status-text">0 items</span>
                    <span id="status-path">/</span>
                </div>

                <!-- Detail Panel Removed -->
            </div>
        </div>

        <!-- Context Menu -->
        <div class="context-menu hidden" id="context-menu">
            <div class="ctx-item" onclick="openSelected()"><i class="fa-solid fa-folder-open"></i> Open</div>
            <div class="ctx-item" onclick="openEditor(selectedItem)"><i class="fa-solid fa-edit"></i> Edit</div>
            <div class="ctx-item" onclick="openInTerminal()"><i class="fa-solid fa-terminal"></i> Open in Terminal</div>
            <div class="ctx-sep"></div>
            <div class="ctx-item" onclick="document.getElementById('upload-input').click(); hideContextMenu()"><i
                    class="fa-solid fa-upload"></i> Upload</div>
            <div class="ctx-sep"></div>
            <div class="ctx-item" onclick="copyItem('cut')"><i class="fa-solid fa-scissors"></i> Cut</div>
            <div class="ctx-item" onclick="copyItem('copy')"><i class="fa-solid fa-copy"></i> Copy</div>
            <div class="ctx-item" onclick="pasteItem()"><i class="fa-solid fa-paste"></i> Paste</div>
            <div class="ctx-sep"></div>
            <div class="ctx-item" onclick="renameItem()"><i class="fa-solid fa-pen"></i> Rename</div>
            <div class="ctx-item danger" onclick="deleteItem()"><i class="fa-solid fa-trash"></i> Delete</div>
        </div>

        <!-- Editor Overlay -->
        <div id="editor-overlay" class="editor-modal" style="display:none">
            <div class="editor-header">
                <h3 id="editor-filename">filename.txt</h3>
                <div style="display:flex; gap:1rem">
                    <button class="fm-btn" onclick="saveFile()"><i class="fa-solid fa-save"></i> Save</button>
                    <button class="fm-btn" style="color:#ff6b6b" onclick="closeEditor()"><i
                            class="fa-solid fa-xmark"></i>
                        Close</button>
                </div>
            </div>
            <div class="editor-body">
                <textarea id="editor-textarea"></textarea>
            </div>
        </div>

        <script src="{{ url_for('static', filename='files.js') }}?v=4"></script>


    <div id="drop-overlay">
        <i class="fa-solid fa-cloud-arrow-up"></i>
        <div>Drop files here to upload</div>
    </div>
</body>

</html>
