<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal - MuhfiDesk</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <!-- xterm.js -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            color: #fff;
            overflow: hidden; /* Prevent body scroll */
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 1rem;
            gap: 1rem;
        }

        /* Header / Glass Panel */
        .header {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.8rem 1.2rem;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }

        .btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .btn.active {
            background: rgba(116, 185, 255, 0.2);
            border-color: rgba(116, 185, 255, 0.5);
            color: #74b9ff;
            box-shadow: 0 0 15px rgba(116, 185, 255, 0.2);
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 0.5rem;
            flex: 1;
            overflow-x: auto;
            padding: 0 0.5rem;
        }
        .tabs::-webkit-scrollbar { height: 4px; }
        .tabs::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }

        .tab {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid transparent;
            color: #8b949e;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            white-space: nowrap;
            min-width: 140px;
            transition: all 0.2s;
        }

        .tab:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #c9d1d9;
        }

        .tab.active {
            background: rgba(85, 239, 196, 0.1);
            color: #55efc4;
            border-color: rgba(85, 239, 196, 0.3);
            box-shadow: 0 0 10px rgba(85, 239, 196, 0.1);
        }

        .tab-name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            outline: none;
        }

        .tab-name:focus {
            border-bottom: 1px dashed #55efc4;
        }

        .tab .close-tab {
            opacity: 0;
            cursor: pointer;
            font-size: 0.75rem;
            transition: opacity 0.2s, color 0.2s;
            color: #8b949e;
        }

        .tab:hover .close-tab {
            opacity: 1;
        }

        .tab .close-tab:hover {
            color: #ff7675;
        }

        /* Quick Commands Panel */
        .quick-commands {
            display: flex;
            gap: 1rem;
            padding: 1rem;
            background: rgba(20, 20, 30, 0.5);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            flex-wrap: wrap;
            align-items: center;
        }

        .cmd-category {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            background: rgba(0, 0, 0, 0.3);
            padding: 0.3rem;
            border-radius: 10px;
        }

        .cmd-category-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.5px;
            padding: 0.3rem 0.6rem;
            border-radius: 6px;
            margin-right: 0.2rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .cmd-category-label.system { background: rgba(85, 239, 196, 0.1); color: #55efc4; }
        .cmd-category-label.docker { background: rgba(36, 150, 237, 0.1); color: #2496ed; }
        .cmd-category-label.network { background: rgba(162, 155, 254, 0.1); color: #a29bfe; }
        .cmd-category-label.logs { background: rgba(255, 234, 167, 0.1); color: #ffeaa7; }

        .quick-btn {
            background: transparent;
            border: 1px solid transparent;
            color: #aaa;
            padding: 0.4rem 0.6rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            font-family: 'Consolas', monospace;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            transition: all 0.2s;
        }

        .quick-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }

        /* Mac-like Terminal Area */
        .terminal-container {
            flex: 1;
            background: #0f111a;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Terminal Window Bar */
        .terminal-container::before {
            content: 'TERMINAL — root@muhfidesk';
            display: flex;
            align-items: center;
            justify-content: center;
            height: 40px;
            background: rgba(30, 33, 45, 0.9);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            width: 100%;
            font-size: 0.75rem;
            font-weight: 700;
            color: #8b949e;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }
        
        /* Mac Window Dots */
        .terminal-container::after {
            content: '';
            position: absolute;
            top: 14px;
            left: 18px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff5f56;
            box-shadow: 22px 0 0 #ffbd2e, 44px 0 0 #27c93f;
            z-index: 2;
        }

        .terminal-wrap {
            flex: 1;
            padding: 1.2rem;
            display: none;
            background: #0d0f14;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.5);
        }

        .terminal-wrap.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .terminal-wrap .xterm {
            height: 100%;
        }
        
        .xterm-viewport::-webkit-scrollbar { width: 10px; }
        .xterm-viewport::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 5px; }
        .xterm-viewport::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 5px; }
        .xterm-viewport::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.3); }

        /* Settings Bar Footer */
        .settings-bar {
            display: flex;
            gap: 1.5rem;
            padding: 0.8rem 1.5rem;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 12px;
            align-items: center;
            font-size: 0.85rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .settings-bar label {
            color: #8b949e;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            cursor: pointer;
        }

        .settings-bar select {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            outline: none;
        }
        
        .settings-bar select:focus {
            border-color: #55efc4;
        }

        .readonly-badge {
            background: rgba(255, 107, 107, 0.2);
            color: #ff6b6b;
            border: 1px solid rgba(255, 107, 107, 0.4);
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            animation: pulseError 2s infinite;
        }

        @keyframes pulseError {
            0% { box-shadow: 0 0 0 0 rgba(255, 107, 107, 0.4); }
            70% { box-shadow: 0 0 0 6px rgba(255, 107, 107, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 107, 107, 0); }
        }

        /* Modal */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s;
        }

        .modal.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal-content {
            background: #1e1e28;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            border-radius: 16px;
            padding: 2rem;
            width: 500px;
            max-width: 90%;
            transform: scale(0.95);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal.active .modal-content {
            transform: scale(1);
        }

        .modal-content h3 {
            margin-bottom: 1rem;
            font-size: 1.2rem;
            color: #fff;
        }

        .modal-content textarea {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #55efc4;
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            font-family: 'Consolas', monospace;
            min-height: 150px;
            resize: vertical;
            outline: none;
        }
        
        .modal-content textarea:focus {
            border-color: #55efc4;
            box-shadow: 0 0 10px rgba(85,239,196,0.1);
        }

        .modal-actions {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
        }
    </style>
    <script src="{{ url_for('static', filename='theme.js') }}"></script>
</head>

<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <button class="btn" onclick="window.location.href='/dashboard'"><i class="fa-solid fa-home"></i></button>
            <h2 style="font-weight:400; font-size:1rem"><i class="fa-solid fa-terminal" style="color:#55efc4"></i>
                Terminal</h2>

            <div class="tabs" id="tabs"></div>

            <button class="btn" onclick="addTab()"><i class="fa-solid fa-plus"></i></button>
            <button class="btn" onclick="showCustomCmdModal()"><i class="fa-solid fa-gear"></i></button>
        </div>

        <!-- Quick Commands - Categorized -->
        <div class="quick-commands">
            <!-- System -->
            <div class="cmd-category">
                <span class="cmd-category-label system"><i class="fa-solid fa-server"></i> System</span>
                <button class="quick-btn system" onclick="quickCmd('htop')"><i class="fa-solid fa-chart-line"></i>
                    htop</button>
                <button class="quick-btn system" onclick="quickCmd('top -b -n 1 | head -20')"><i
                        class="fa-solid fa-list"></i> top</button>
                <button class="quick-btn system" onclick="quickCmd('df -h')"><i class="fa-solid fa-hard-drive"></i> df
                    -h</button>
                <button class="quick-btn system" onclick="quickCmd('free -h')"><i class="fa-solid fa-memory"></i>
                    free</button>
                <button class="quick-btn system" onclick="quickCmd('uptime')"><i class="fa-solid fa-clock"></i>
                    uptime</button>
            </div>

            <!-- Docker -->
            <div class="cmd-category">
                <span class="cmd-category-label docker"><i class="fa-brands fa-docker"></i> Docker</span>
                <button class="quick-btn docker" onclick="quickCmd('docker ps')"><i class="fa-solid fa-cube"></i>
                    ps</button>
                <button class="quick-btn docker" onclick="quickCmd('docker ps -a')"><i class="fa-solid fa-cubes"></i> ps
                    -a</button>
                <button class="quick-btn docker" onclick="quickCmd('docker stats --no-stream')"><i
                        class="fa-solid fa-chart-bar"></i> stats</button>
                <button class="quick-btn docker" onclick="quickCmd('docker images')"><i
                        class="fa-solid fa-layer-group"></i> images</button>
            </div>

            <!-- Network -->
            <div class="cmd-category">
                <span class="cmd-category-label network"><i class="fa-solid fa-network-wired"></i> Network</span>
                <button class="quick-btn network" onclick="quickCmd('netstat -tlnp')"><i class="fa-solid fa-plug"></i>
                    netstat</button>
                <button class="quick-btn network" onclick="quickCmd('ip a')"><i class="fa-solid fa-ethernet"></i> ip
                    a</button>
                <button class="quick-btn network" onclick="quickCmd('ss -tuln')"><i
                        class="fa-solid fa-diagram-project"></i> ss</button>
            </div>

            <!-- Logs -->
            <div class="cmd-category">
                <span class="cmd-category-label logs"><i class="fa-solid fa-file-lines"></i> Logs</span>
                <button class="quick-btn logs" onclick="quickCmd('journalctl -f')"><i class="fa-solid fa-scroll"></i>
                    journal</button>
                <button class="quick-btn logs" onclick="quickCmd('dmesg -w')"><i class="fa-solid fa-bug"></i>
                    dmesg</button>
                <button class="quick-btn logs" onclick="quickCmd('tail -f /var/log/syslog')"><i
                        class="fa-solid fa-file-alt"></i> syslog</button>
            </div>

            <!-- ESP32 & MuhfiDesk -->
            <div class="cmd-category">
                <span class="cmd-category-label system" style="background:rgba(255, 107, 107, 0.15); color:#ff6b6b">
                    <i class="fa-solid fa-microchip"></i> ESP32
                </span>
                <button class="quick-btn system" style="border-color: rgba(255, 107, 107, 0.3); color: #ff9f9f"
                    onclick="quickCmd('export TERM=xterm && screen /dev/ttyACM1 115200')">
                    <i class="fa-solid fa-bolt"></i> CONNECT SERIAL
                </button>
                <button class="quick-btn system" style="border-color: rgba(85, 239, 196, 0.3); color: #55efc4"
                    onclick="quickCmd('sudo muhfidesk update')">
                    <img src="/static/favicon.svg" style="width: 14px; height: 14px; filter: brightness(0) saturate(100%) invert(86%) sepia(35%) saturate(543%) hue-rotate(97deg) brightness(101%) contrast(92%);"> UPDATE MUHFIDESK
                </button>
            </div>

            <!-- Custom Commands -->
            <div class="cmd-category" id="custom-commands"></div>
        </div>

        <!-- Terminal Area -->
        <div class="terminal-container" id="terminal-container"></div>

        <!-- Settings -->
        <div class="settings-bar">
            <label>Font:
                <select id="font-size" onchange="changeFontSize(this.value)">
                    <option value="12">12px</option>
                    <option value="14" selected>14px</option>
                    <option value="16">16px</option>
                    <option value="18">18px</option>
                </select>
            </label>
            <label>
                <input type="checkbox" id="read-only" onchange="toggleReadOnly(this.checked)"> Read-Only
            </label>
            <span id="readonly-badge" class="readonly-badge" style="display:none">READ-ONLY</span>
            <span style="margin-left:auto; color:#666">Ctrl+C to interrupt • Double-click tab to rename</span>
        </div>
    </div>

    <!-- Custom Command Modal -->
    <div class="modal hidden" id="custom-cmd-modal">
        <div class="modal-content">
            <h3><i class="fa-solid fa-terminal"></i> Custom Commands</h3>
            <p style="color:#888; font-size:0.85rem; margin-bottom:1rem">Add your own quick commands (one per line:
                name=command)</p>
            <textarea id="custom-cmd-input" placeholder="Example:
MySQL=docker exec -it mariadb mysql -u root -p
Logs=tail -f /var/log/app.log
Restart App=systemctl restart myapp"></textarea>
            <div class="modal-actions">
                <button class="btn" onclick="hideCustomCmdModal()">Cancel</button>
                <button class="btn active" onclick="saveCustomCommands()"><i class="fa-solid fa-save"></i> Save</button>
            </div>
        </div>
    </div>    <script>
        let terminals = {};
        let activeTab = null;
        let tabCounter = 0;
        let isReadOnly = false;
        let currentFontSize = 14;

        // URL params
        const urlParams = new URLSearchParams(window.location.search);
        const startPath = urlParams.get('path') || '/root';
        const startCmd = urlParams.get('cmd') || '';

        // Load custom commands from localStorage
        let customCommands = JSON.parse(localStorage.getItem('customCommands') || '[]');

        document.addEventListener('DOMContentLoaded', () => {
            addTab(startPath, startCmd ? 'Command' : 'Terminal 1');
            renderCustomCommands();

            if (startCmd) {
                setTimeout(() => quickCmd(startCmd), 1500);
            }
        });

        function getNeofetchOutput() {
            return `\r\n\x1b[36m       _,met$$$$$gg.\x1b[0m           \x1b[1;32mroot\x1b[0m@\x1b[1;32mmuhfidesk\x1b[0m
\x1b[36m    ,g$$$$$$$$$$$$$$$P.\x1b[0m         ----------------
\x1b[36m  ,g$$P"     """Y$$.". \x1b[0m         \x1b[36mOS\x1b[0m: Debian GNU/Linux 12 (bookworm)
\x1b[36m ,$$P'              \`$$$. \x1b[0m      \x1b[36mKernel\x1b[0m: 6.1.0-18-amd64
\x1b[36m',$$P       ,ggs.     \`$$b:\x1b[0m     \x1b[36mUptime\x1b[0m: 3 days, 14 hours, 21 mins
\x1b[36m\`d$$'     ,$P"'   .    $$$ \x1b[0m     \x1b[36mPackages\x1b[0m: 1420 (dpkg)
\x1b[36m $$P      d$'     ,    $$P \x1b[0m     \x1b[36mShell\x1b[0m: bash 5.2.15
\x1b[36m $$:      $$.   -    ,d$$' \x1b[0m     \x1b[36mTerminal\x1b[0m: xterm.js
\x1b[36m $$;      Y$b._   _,d$P'   \x1b[0m     \x1b[36mCPU\x1b[0m: AMD Ryzen 9 5950X (32) @ 3.400GHz
\x1b[36m Y$$.    \`.\`"Y$$$$P"'      \x1b[0m     \x1b[36mMemory\x1b[0m: 10485MiB / 64234MiB
\x1b[36m \`$$b      "-.__           \x1b[0m     
\x1b[36m  \`Y$$                     \x1b[0m     
\x1b[36m   \`Y$$.                   \x1b[0m     
\x1b[36m     \`$$b.                 \x1b[0m     
\x1b[36m       \`Y$$b.              \x1b[0m     
\x1b[36m          \`"Y$b._          \x1b[0m     
\x1b[36m              \`"""         \x1b[0m     \r\n`;
        }

        const PROMPT = `\r\n\x1b[1;32mroot@muhfidesk\x1b[0m:\x1b[1;34m~\x1b[0m# `;

        function writePrompt(term) {
            term.write(PROMPT);
        }

        function runMockBootSequence(term, onComplete) {
            const bootLines = [
                "Booting MuhfiDesk...",
                "Loading system core...",
                "Initializing services...",
                "Starting Docker Engine...",
                "Starting monitoring stack...",
                "System ready."
            ];
            let i = 0;
            term.write('\x1b[33m'); // Yellowish
            function nextLine() {
                if (i < bootLines.length) {
                    term.write(bootLines[i] + '\r\n');
                    i++;
                    setTimeout(nextLine, 150 + Math.random() * 200);
                } else {
                    term.write('\x1b[0m'); // Reset
                    onComplete();
                }
            }
            nextLine();
        }

        function addTab(path = '/root', name = null) {
            tabCounter++;
            const sessionId = 'term_' + tabCounter;
            const tabName = name || `Terminal ${tabCounter}`;

            // Create tab button
            const tabBtn = document.createElement('div');
            tabBtn.className = 'tab';
            tabBtn.id = 'tab-btn-' + sessionId;
            tabBtn.innerHTML = `
                <i class="fa-solid fa-terminal" style="font-size:0.7rem; opacity:0.7"></i>
                <span class="tab-name" contenteditable="true" spellcheck="false" 
                    onblur="saveTabName('${sessionId}', this.textContent)"
                    onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}">${tabName}</span>
                <span class="close-tab" onclick="closeTab('${sessionId}', event)"><i class="fa-solid fa-xmark"></i></span>
            `;
            tabBtn.onclick = (e) => {
                if (!e.target.classList.contains('close-tab') && !e.target.closest('.close-tab') && !e.target.classList.contains('tab-name')) {
                    switchTab(sessionId);
                }
            };
            document.getElementById('tabs').appendChild(tabBtn);

            // Create terminal wrap
            const termWrap = document.createElement('div');
            termWrap.className = 'terminal-wrap';
            termWrap.id = 'term-wrap-' + sessionId;
            document.getElementById('terminal-container').appendChild(termWrap);

            // Create xterm instance with custom theme
            const term = new Terminal({
                cursorBlink: true,
                fontSize: currentFontSize,
                fontFamily: 'Consolas, Monaco, "Courier New", monospace',
                theme: {
                    background: '#15151e',
                    foreground: '#d0d0d0',
                    cursor: '#55efc4',
                    cursorAccent: '#15151e',
                    selection: 'rgba(85,239,196,0.3)',
                    black: '#1e1e28',
                    red: '#ff7675',
                    green: '#55efc4',
                    yellow: '#ffeaa7',
                    blue: '#74b9ff',
                    magenta: '#a29bfe',
                    cyan: '#81ecec',
                    white: '#dfe6e9',
                    brightBlack: '#636e72',
                    brightRed: '#ff7675',
                    brightGreen: '#55efc4',
                    brightYellow: '#ffeaa7',
                    brightBlue: '#74b9ff',
                    brightMagenta: '#a29bfe',
                    brightCyan: '#81ecec',
                    brightWhite: '#ffffff'
                }
            });

            const fitAddon = new FitAddon.FitAddon();
            term.loadAddon(fitAddon);
            
            // Add custom state for JS shell
            term.cmdBuffer = '';
            term.history = [];
            term.historyIndex = -1;

            terminals[sessionId] = { term, fitAddon, path, name: tabName };
            switchTab(sessionId, true);
            term.open(termWrap);
            
            setTimeout(() => {
                try { fitAddon.fit(); } catch(e) {}
                const resizeObserver = new ResizeObserver(() => {
                    if (termWrap.offsetParent === null) return;
                    try { fitAddon.fit(); } catch(e) {}
                });
                resizeObserver.observe(termWrap);
                
                // Boot sequence
                runMockBootSequence(term, () => {
                    executeCommand(term, 'neofetch');
                    writePrompt(term);
                });
            }, 50);

            // Handle Keyboard Input
            term.onData(e => {
                if (isReadOnly) return;
                
                switch (e) {
                    case '\r': // Enter
                        term.write('\r\n');
                        const cmd = term.cmdBuffer.trim();
                        if (cmd.length > 0) {
                            term.history.push(cmd);
                            term.historyIndex = term.history.length;
                            executeCommand(term, cmd);
                        }
                        term.cmdBuffer = '';
                        writePrompt(term);
                        break;
                    case '\u007F': // Backspace (DEL)
                        if (term.cmdBuffer.length > 0) {
                            term.write('\b \b');
                            term.cmdBuffer = term.cmdBuffer.slice(0, -1);
                        }
                        break;
                    case '\x1b[A': // Arrow Up
                        if (term.history.length > 0) {
                            if (term.historyIndex > 0) {
                                term.historyIndex--;
                            }
                            const histCmd = term.history[term.historyIndex];
                            term.write('\x1b[2K\r');
                            term.write(PROMPT.replace('\r\n', '') + histCmd);
                            term.cmdBuffer = histCmd;
                        }
                        break;
                    case '\x1b[B': // Arrow Down
                        if (term.historyIndex < term.history.length - 1) {
                            term.historyIndex++;
                            const histCmd = term.history[term.historyIndex];
                            term.write('\x1b[2K\r');
                            term.write(PROMPT.replace('\r\n', '') + histCmd);
                            term.cmdBuffer = histCmd;
                        } else if (term.historyIndex === term.history.length - 1) {
                            term.historyIndex++;
                            term.write('\x1b[2K\r');
                            term.write(PROMPT.replace('\r\n', ''));
                            term.cmdBuffer = '';
                        }
                        break;
                    case '\x1b[C': // Arrow Right
                    case '\x1b[D': // Arrow Left
                        break;
                    case '\u0003': // Ctrl+C
                        term.write('^C');
                        term.cmdBuffer = '';
                        writePrompt(term);
                        break;
                    default:
                        // Printable chars
                        if (e >= String.fromCharCode(0x20) && e <= String.fromCharCode(0x7E)) {
                            term.cmdBuffer += e;
                            term.write(e);
                        }
                }
            });
        }

        function executeCommand(term, cmd) {
            if (!cmd) return;
            const args = cmd.split(' ');
            const primary = args[0].toLowerCase();
            
            switch (primary) {
                case 'help':
                    term.write('Available mock commands:\r\n');
                    term.write('  help       - Show this help\r\n');
                    term.write('  clear      - Clear the terminal screen\r\n');
                    term.write('  neofetch   - Display system information\r\n');
                    term.write('  ls         - List directory contents\r\n');
                    term.write('  pwd        - Print working directory\r\n');
                    term.write('  whoami     - Print effective userid\r\n');
                    term.write('  date       - Print or set the system data and time\r\n');
                    term.write('  uptime     - Tell how long the system has been running\r\n');
                    term.write('  docker     - Docker CLI (mocked for "docker ps")\r\n');
                    term.write('  sudo       - Execute command as superuser\r\n');
                    term.write('  muhfidesk  - MuhfiDesk CLI utility\r\n');
                    break;
                case 'clear':
                    term.clear();
                    break;
                case 'neofetch':
                    term.write(getNeofetchOutput());
                    break;
                case 'ls':
                    term.write('\x1b[1;34mapp\x1b[0m   \x1b[1;34mconfig\x1b[0m   docker-compose.yml   install.sh   \x1b[1;34mscripts\x1b[0m   README.md\r\n');
                    break;
                case 'pwd':
                    term.write('/root/muhfidesk\r\n');
                    break;
                case 'whoami':
                    term.write('root\r\n');
                    break;
                case 'date':
                    term.write(new Date().toString() + '\r\n');
                    break;
                case 'uptime':
                    term.write(' 14:35:01 up 3 days, 14:21,  1 user,  load average: 0.15, 0.22, 0.18\r\n');
                    break;
                case 'sudo':
                case 'muhfidesk':
                    if (cmd.includes('update')) {
                        term.write('Updating MuhfiDesk...\r\n');
                        term.write('Pulling latest changes from origin/main...\r\n');
                        term.write('Installing any new dependencies...\r\n');
                        term.write('\x1b[1;32mUpdate complete!\x1b[0m\r\n');
                    } else {
                        term.write(`bash: ${primary}: command not found\r\n`);
                    }
                    break;
                case 'docker':
                    if (args[1] === 'ps') {
                        term.write('CONTAINER ID   IMAGE                 COMMAND                  CREATED        STATUS        PORTS                               NAMES\r\n');
                        term.write('c4a1b5c23d4e   portainer/portainer   "/portainer"             3 days ago     Up 3 days     0.0.0.0:8000->8000/tcp, 9000/tcp    portainer\r\n');
                        term.write('a1b2c3d4e5f6   nginx:alpine          "/docker-entrypoint.…"   3 days ago     Up 3 days     0.0.0.0:80->80/tcp                  nginx_proxy\r\n');
                        term.write('f7e8d9c0b1a2   redis:alpine          "docker-entrypoint.s…"   3 days ago     Up 3 days     6379/tcp                            redis_cache\r\n');
                        term.write('1a2b3c4d5e6f   prom/prometheus       "/bin/prometheus"        3 days ago     Up 3 days     0.0.0.0:9090->9090/tcp              prometheus\r\n');
                    } else if (args[1] === 'images') {
                        term.write('REPOSITORY            TAG       IMAGE ID       CREATED        SIZE\r\n');
                        term.write('nginx                 alpine    a1b2c3d4e5f6   3 days ago     23MB\r\n');
                        term.write('portainer/portainer   latest    c4a1b5c23d4e   2 weeks ago    215MB\r\n');
                        term.write('redis                 alpine    f7e8d9c0b1a2   3 weeks ago    32MB\r\n');
                    } else if (args[1] === 'stats') {
                        term.write('CONTAINER ID   NAME          CPU %     MEM USAGE / LIMIT     MEM %     NET I/O           BLOCK I/O         PIDS\r\n');
                        term.write('c4a1b5c23d4e   portainer     0.01%     32.4MiB / 62.73GiB    0.05%     1.2MB / 4.5MB     12MB / 5.2MB      14\r\n');
                        term.write('a1b2c3d4e5f6   nginx_proxy   0.00%     5.2MiB / 62.73GiB     0.01%     3.4MB / 12MB      4.1MB / 0B        2\r\n');
                    } else {
                        term.write(`docker: '${args[1] || ''}' is not a docker command.\r\nSee 'docker --help'\r\n`);
                    }
                    break;
                case 'top':
                case 'htop':
                    term.write('top - 14:35:01 up 3 days, 14:21,  1 user,  load average: 0.15, 0.22, 0.18\r\n');
                    term.write('Tasks: 120 total,   1 running, 119 sleeping,   0 stopped,   0 zombie\r\n');
                    term.write('%Cpu(s):  2.3 us,  1.1 sy,  0.0 ni, 96.5 id,  0.0 wa,  0.0 hi,  0.1 si,  0.0 st\r\n');
                    term.write('MiB Mem :  64234.0 total,  51240.2 free,  10485.4 used,   2508.4 buff/cache\r\n');
                    term.write('MiB Swap:   8192.0 total,   8192.0 free,      0.0 used.  53120.5 avail Mem \r\n');
                    term.write('\r\n');
                    term.write('  PID USER      PR  NI    VIRT    RES    SHR S  %CPU  %MEM     TIME+ COMMAND\r\n');
                    term.write('    1 root      20   0  168532  11964   8252 S   0.0   0.0   0:04.21 systemd\r\n');
                    term.write('  452 root      20   0 2486716  65232  31512 S   1.3   0.1   2:14.33 dockerd\r\n');
                    term.write(' 1245 root      20   0  954204  45120  15304 S   0.7   0.1   1:05.42 python3\r\n');
                    break;
                case 'df':
                    term.write('Filesystem      Size  Used Avail Use% Mounted on\r\n');
                    term.write('udev             32G     0   32G   0% /dev\r\n');
                    term.write('tmpfs           6.3G  1.5M  6.3G   1% /run\r\n');
                    term.write('/dev/sda1       500G  124G  351G  27% /\r\n');
                    term.write('tmpfs            32G     0   32G   0% /dev/shm\r\n');
                    break;
                case 'free':
                    term.write('               total        used        free      shared  buff/cache   available\r\n');
                    term.write('Mem:           64234       10485       51240          45        2508       53120\r\n');
                    term.write('Swap:           8192           0        8192\r\n');
                    break;
                case 'netstat':
                case 'ss':
                    term.write('Active Internet connections (only servers)\r\n');
                    term.write('Proto Recv-Q Send-Q Local Address           Foreign Address         State       PID/Program name    \r\n');
                    term.write('tcp        0      0 0.0.0.0:22              0.0.0.0:*               LISTEN      -                   \r\n');
                    term.write('tcp        0      0 0.0.0.0:80              0.0.0.0:*               LISTEN      -                   \r\n');
                    term.write('tcp        0      0 127.0.0.1:5000          0.0.0.0:*               LISTEN      -                   \r\n');
                    term.write('tcp6       0      0 :::22                   :::*                    LISTEN      -                   \r\n');
                    break;
                case 'ip':
                    term.write('1: lo: <LOOPBACK,UP,LOWER_UP> mtu 65536 qdisc noqueue state UNKNOWN group default qlen 1000\r\n');
                    term.write('    link/loopback 00:00:00:00:00:00 brd 00:00:00:00:00:00\r\n');
                    term.write('    inet 127.0.0.1/8 scope host lo\r\n');
                    term.write('2: eth0: <BROADCAST,MULTICAST,UP,LOWER_UP> mtu 1500 qdisc mq state UP group default qlen 1000\r\n');
                    term.write('    link/ether aa:bb:cc:dd:ee:ff brd ff:ff:ff:ff:ff:ff\r\n');
                    term.write('    inet 192.168.1.100/24 brd 192.168.1.255 scope global dynamic eth0\r\n');
                    break;
                case 'journalctl':
                case 'dmesg':
                case 'tail':
                    term.write('[  345.123456] eth0: link up, 1000Mbps, full-duplex, lpa 0x3800\r\n');
                    term.write('[  345.234567] IPv6: ADDRCONF(NETDEV_CHANGE): eth0: link becomes ready\r\n');
                    term.write('[ 1205.987654] usb 1-1: new high-speed USB device number 2 using xhci_hcd\r\n');
                    term.write('[ 1206.123456] usb 1-1: New USB device found, idVendor=2341, idProduct=0043, bcdDevice= 0.01\r\n');
                    term.write('[ 1206.123456] cdc_acm 1-1:1.0: ttyACM1: USB ACM device\r\n');
                    break;
                case 'export':
                    break;
                default:
                    if (primary !== '') {
                        term.write(`bash: ${primary}: command not found\r\n`);
                    }
            }
        }

        function saveTabName(sessionId, name) {
            if (terminals[sessionId]) {
                terminals[sessionId].name = name.trim() || 'Terminal';
            }
        }

        function switchTab(sessionId, skipFit = false) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.terminal-wrap').forEach(t => t.classList.remove('active'));

            document.getElementById('tab-btn-' + sessionId)?.classList.add('active');
            document.getElementById('term-wrap-' + sessionId)?.classList.add('active');

            activeTab = sessionId;

            if (!skipFit && terminals[sessionId] && terminals[sessionId].term.element) {
                terminals[sessionId].term.focus();
                setTimeout(() => {
                    try { terminals[sessionId].fitAddon.fit(); } catch(e) {}
                }, 50);
            }
        }

        function closeTab(sessionId, event) {
            event.stopPropagation();
            document.getElementById('tab-btn-' + sessionId)?.remove();
            document.getElementById('term-wrap-' + sessionId)?.remove();

            if (terminals[sessionId]) {
                terminals[sessionId].term.dispose();
                delete terminals[sessionId];
            }

            if (activeTab === sessionId) {
                const remaining = Object.keys(terminals);
                if (remaining.length > 0) {
                    switchTab(remaining[0]);
                } else {
                    activeTab = null;
                }
            }
        }

        function quickCmd(cmd) {
            if (activeTab && terminals[activeTab] && !isReadOnly) {
                const t = terminals[activeTab].term;
                // clear line and put command
                t.write('\x1b[2K\r');
                t.write(PROMPT.replace('\r\n', '') + cmd + '\r\n');
                executeCommand(t, cmd);
                writePrompt(t);
                t.cmdBuffer = '';
            }
        }

        function changeFontSize(size) {
            currentFontSize = parseInt(size);
            Object.values(terminals).forEach(t => {
                t.term.options.fontSize = currentFontSize;
                t.fitAddon.fit();
            });
        }

        function toggleReadOnly(checked) {
            isReadOnly = checked;
            document.getElementById('readonly-badge').style.display = checked ? 'inline-block' : 'none';
        }

        function renderCustomCommands() {
            const container = document.getElementById('custom-commands');
            if (customCommands.length === 0) {
                container.innerHTML = '';
                return;
            }

            container.innerHTML = `
                <span class="cmd-category-label" style="background:rgba(255,255,255,0.1); color:#888">
                    <i class="fa-solid fa-star"></i> Custom
                </span>
                ${customCommands.map(c => `
                    <button class="quick-btn" onclick="quickCmd('${c.cmd.replace(/'/g, "\\'")}')" title="${c.cmd}">
                        <i class="fa-solid fa-bolt"></i> ${c.name}
                    </button>
                `).join('')}
            `;
        }

        function showCustomCmdModal() {
            const modal = document.getElementById('custom-cmd-modal');
            modal.classList.remove('hidden');
            modal.classList.add('active');
            document.getElementById('custom-cmd-input').value = customCommands.map(c => `${c.name}=${c.cmd}`).join('\n');
        }

        function hideCustomCmdModal() {
            const modal = document.getElementById('custom-cmd-modal');
            modal.classList.remove('active');
            setTimeout(() => modal.classList.add('hidden'), 300); // Wait for transition
        }

        function saveCustomCommands() {
            const input = document.getElementById('custom-cmd-input').value;
            customCommands = input.split('\n')
                .map(line => line.trim())
                .filter(line => line && line.includes('='))
                .map(line => {
                    const idx = line.indexOf('=');
                    return {
                        name: line.substring(0, idx).trim(),
                        cmd: line.substring(idx + 1).trim()
                    };
                });

            localStorage.setItem('customCommands', JSON.stringify(customCommands));
            renderCustomCommands();
            hideCustomCmdModal();
        }
    </script>
